<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- favicon links -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-16x16.png" sizes="16x16" />
    <link rel="icon" type="image/png" href="/favicon-48x48.png" sizes="48x48" />
    <link
      rel="icon"
      type="image/png"
      href="/favicon-128x128.png"
      sizes="128x128"
    />
    <link
      rel="icon"
      type="image/png"
      href="/favicon-192x192.png"
      sizes="192x192"
    />

    <!-- Apple -->
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180x180.png" />

    <!-- Fonts. Loaded here rather than via @import in the CSS bundle: the
         import chained font discovery behind HTML -> JS -> CSS -> fonts CSS,
         which alone put LCP past 6s on a throttled phone. The preconnects
         let the browser open both origins while the stylesheet downloads. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
  rel="preload"
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap"
  as="style"
  onload="this.onload=null;this.rel='stylesheet'"
/>

<noscript>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap"
  />
</noscript>

    <!-- meta links -->
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#006CFA" />
    <!-- Base copy for crawlers that do not run JS; each page overwrites it on mount. -->
    <meta
      name="description"
      content="Scaalable builds high-performance websites, SaaS platforms and AI-powered software for startups and established teams."
    />
    <!-- Reset per route by setPageMeta; declared here so the value is present
         before React mounts. max-image-preview:large opts the site into full
         size image thumbnails in results, which the default 'standard' caps. -->
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <!-- Social cards. Static, site-level: scrapers do not run JavaScript, so
         per-route values set from React would never be seen by them anyway.

         Every absolute URL on this page uses the www host: it is the canonical
         origin, and pointing a card at a host that redirects costs a hop some
         scrapers do not follow. This assumes the apex 301s to www at the DNS
         or host level — without that redirect both hosts serve the same pages
         and the duplicate the canonical is meant to settle stays live. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Scaalable" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Scaalable — Build Digital Products That Grow Your Business" />
    <meta
      property="og:description"
      content="Scaalable builds high-performance websites, SaaS platforms and AI-powered software for startups and established teams."
    />
    <meta property="og:url" content="https://www.scaalable.com/" />
    <meta property="og:image" content="https://www.scaalable.com/favicon-512x512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Scaalable" />
    <!-- 'summary', not 'summary_large_image': the only card asset is the 512px
         square icon, and the large variant crops a square to 2:1. Switch both
         once a 1200x630 banner exists. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="@scaalable" />
    <meta name="twitter:title" content="Scaalable — Build Digital Products That Grow Your Business" />
    <meta
      name="twitter:description"
      content="Scaalable builds high-performance websites, SaaS platforms and AI-powered software for startups and established teams."
    />
    <meta name="twitter:image" content="https://www.scaalable.com/favicon-512x512.png" />

    <!-- The home page's own title rather than the bare brand: this is what a
         crawler that does not render JavaScript indexes, and what shows in the
         tab for the fraction of a second before React mounts. -->
    <title>Scaalable — Build Digital Products That Grow Your Business</title>

    <!-- Site-wide structured data. Static on purpose: the business identity is
         the one thing that must survive a crawler that never runs the app.
         Per-route nodes (breadcrumbs, FAQ, service catalogue) are injected by
         src/lib/structuredData.js and reference these two by @id. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": ["Organization", "ProfessionalService"],
            "@id": "https://www.scaalable.com/#organization",
            "name": "Scaalable",
            "url": "https://www.scaalable.com/",
            "description": "Scaalable builds high-performance websites, SaaS platforms and AI-powered software for startups and established teams.",
            "email": "info@scaalable.com",
            "telephone": "+91-7596918803",
            "logo": {
              "@type": "ImageObject",
              "@id": "https://www.scaalable.com/#logo",
              "url": "https://www.scaalable.com/favicon-512x512.png",
              "width": 512,
              "height": 512
            },
            "image": "https://www.scaalable.com/favicon-512x512.png",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Konnagar",
              "addressRegion": "West Bengal",
              "addressCountry": "IN"
            },
            "geo": {
              "@type": "GeoCoordinates",
              "latitude": 22.6946012,
              "longitude": 88.3496334
            },
            "areaServed": "Worldwide",
            "contactPoint": [
              {
                "@type": "ContactPoint",
                "contactType": "sales",
                "telephone": "+91-7596918803",
                "email": "info@scaalable.com",
                "availableLanguage": ["en"],
                "areaServed": "Worldwide"
              },
              {
                "@type": "ContactPoint",
                "contactType": "customer support",
                "email": "support@scaalable.com",
                "availableLanguage": ["en"],
                "areaServed": "Worldwide"
              }
            ],
            "sameAs": [
              "https://www.linkedin.com/company/scaalable/",
              "https://x.com/scaalable",
              "https://instagram.com/scaalable",
              "https://facebook.com/scaalable",
              "https://github.com/Scaalable-dev"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://www.scaalable.com/#website",
            "url": "https://www.scaalable.com/",
            "name": "Scaalable",
            "description": "Scaalable builds high-performance websites, SaaS platforms and AI-powered software for startups and established teams.",
            "publisher": { "@id": "https://www.scaalable.com/#organization" },
            "inLanguage": "en"
          }
        ]
      }
    </script>

    <!-- Google tag (gtag.js). Kept inside the head element: it previously sat
         after the head closed and before the body opened, invalid HTML the
         parser has to repair. (Do not write a literal closing head tag in
         this comment — Vite injects the build's script tags before the first
         one it finds, comment or not, which commented out the entire app.)
         `async` keeps it off the critical path. The config fires the initial
         page_view; client-side route changes are reported from App.jsx, which
         GA cannot see on its own in a single-page app. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-CN7N9RTL4T");

      /* The gtag script itself is injected after the window load event: its
         180KB was executing during app boot and cost around half a second of
         mobile main-thread before first paint. Everything queued in dataLayer
         above — including the initial page_view — is sent the moment it
         arrives, so no data is lost, it just stops competing with the page. */
      window.addEventListener("load", function () {
        var s = document.createElement("script");
        s.async = true;
        s.src = "https://www.googletagmanager.com/gtag/js?id=G-CN7N9RTL4T";
        document.head.appendChild(s);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
